name: Validate Specs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 状态转移校验需要对照 git HEAD 版本
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # 校验器为仓内实现（.github/spectools/cmd/validate），规则与
      # kt-cli internal/spec 镜像，字段契约事实源在 kt-spec-driven-playbook。
      - name: 校验 frontmatter schema 与状态转移
        run: |
          cd .github/spectools
          go run ./cmd/validate "$GITHUB_WORKSPACE/requirements" "$GITHUB_WORKSPACE/designs"

  publish-index:
    # main 合并后生成 spec-index.json（SpecDeck 数据源，合同见 PLAN-2026-0001）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: 生成 spec-index.json
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cd .github/spectools
          go run ./cmd/indexer --out "$RUNNER_TEMP/spec-index.json" \
            "$GITHUB_WORKSPACE/requirements" "$GITHUB_WORKSPACE/designs"
      # 托管已按决策 B 落定：kt-spec-runtime 直接拉取 GitHub 文档并
      # 进程内构建索引（前端数据源）。本 job 的 artifact 仅作审计/调试留痕。
      - uses: actions/upload-artifact@v7
        with:
          name: spec-index
          path: ${{ runner.temp }}/spec-index.json
