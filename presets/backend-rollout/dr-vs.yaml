# 权重流量版配套：DestinationRule subsets + VirtualService（argo-rollouts v1.9）
# Rollout 会自动把 stable/canary 标签（rollouts-pod-template-hash）打到对应 RS 的 Pod 上
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: __SERVICE__-dr
  namespace: __NAMESPACE__
spec:
  host: __SERVICE__
  subsets:
    - name: stable
      labels:
        rollouts-pod-template-hash: stable
    - name: canary
      labels:
        rollouts-pod-template-hash: canary
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: __SERVICE__-vs
  namespace: __NAMESPACE__
spec:
  hosts:
    - __SERVICE__
  http:
    - route:
        - destination:
            host: __SERVICE__
            subset: stable
          weight: 100
        - destination:
            host: __SERVICE__
            subset: canary
          weight: 0
